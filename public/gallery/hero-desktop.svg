<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1C18" />
      <stop offset="100%" stop-color="#33291A" />
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFCF40" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#FFCF40" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#FFFFFF" stroke-width="0.6" stroke-opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="900" height="700" fill="url(#bg)" />
  <rect width="900" height="700" fill="url(#glow)" />
  <rect width="900" height="700" fill="url(#grid)" />

  <!-- Architectural Archway Silhouette -->
  <path d="M 450 90 A 210 210 0 0 1 660 300 L 660 620 L 240 620 L 240 300 A 210 210 0 0 1 450 90 Z" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFCF40" stroke-width="1.5" stroke-opacity="0.4" />
  <circle cx="512" cy="240" r="110" fill="#FFCF40" fill-opacity="0.14" />

  <!-- Arabic Watermark -->
  <text x="450" y="340" text-anchor="middle" fill="#FFCF40" font-family="Georgia, serif" font-size="120" font-weight="700" opacity="0.24">الْمَرْكَزُ الْعَرَبِيَّة</text>

  <!-- Bottom Editorial Caption Frame -->
  <rect x="48" y="48" width="804" height="604" rx="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5" />
  <text x="84" y="102" fill="#FFCF40" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3">EKOSISTEM BAHASA ARAB · MARKAZ ARABIYAH</text>
  <text x="84" y="575" fill="#FFFFFF" font-family="Georgia, Playfair Display, serif" font-size="34" font-weight="700">Kampus Markaz Arabiyah · Kampung Inggris Pare</text>
  <rect x="84" y="596" width="90" height="4" rx="2" fill="#FFCF40" />
</svg>